name: Deploy admin portal to Xneelo


on:
  push:
    branches: ['master']
    paths:
      - 'admin/**'
      - 'package-lock.json'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'admin-portal'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Xneelo
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the deploy target
        id: target
        env:
          FTP_ADMIN_DIR: ${{ secrets.FTP_ADMIN_DIR }}
        run: |
          DIR="${FTP_ADMIN_DIR:-admin.corpus-christi-garsfontein.org/}"
          case "$DIR" in
            */) ;;
            *) echo "::error::FTP_ADMIN_DIR must end in a slash. Got: $DIR"; exit 1 ;;
          esac
          if [ "$DIR" = "public_html/" ] || [ "$DIR" = "/" ] || [ "$DIR" = "./" ]; then
            echo "::error::FTP_ADMIN_DIR points at the website's document root. That would overwrite corpus-christi-garsfontein.org. Point it at the subdomain's directory instead."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Deploying the portal to $DIR"

      - name: Check the FTP credentials are present
        env:
          FTP_USER_NAME: ${{ secrets.FTP_USER_NAME }}
          FTP_USER_PASSWORD: ${{ secrets.FTP_USER_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_USER_NAME" ] && missing="$missing FTP_USER_NAME"
          [ -z "$FTP_USER_PASSWORD" ] && missing="$missing FTP_USER_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing. Add them to the Xneelo environment in Settings -> Environments. An absent secret arrives as an empty string, which the server answers with 530 Login incorrect."
            exit 1
          fi
          echo "Both FTP credentials are present (username is ${#FTP_USER_NAME} characters)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: admin/.next/cache
          key: ${{ runner.os }}-admin-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('admin/**/*.[jt]s', 'admin/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-admin-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:admin

      - name: Build the portal
        run: npm run build:admin

      - name: Check the build produced a site
        run: |
          test -f admin/out/index.html || { echo "::error::admin/out/index.html is missing — the export did not produce a site."; exit 1; }
          if [ -d admin/out/_next ] && grep -rqs "Corpus Christi Anglican Church | Worship" admin/out/*.html; then
            echo "::error::The admin export contains the public website's pages."
            exit 1
          fi
          echo "Exported pages:"
          find admin/out -name '*.html' | sort

      - name: Sync to the admin subdomain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 197.221.14.50
          username: ${{ secrets.FTP_USER_NAME }}
          password: ${{ secrets.FTP_USER_PASSWORD }}
          server-dir: ${{ steps.target.outputs.dir }}
          local-dir: ./admin/out/
